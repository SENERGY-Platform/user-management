name: 'DEV Docker Image'

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  multi:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      # The build context is the Git repository at the pushed commit, which leaves out
      # .git unless asked to keep it. The Dockerfile reads the commit from it.
      build-args: |
        BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      meta-images: |
        smartenergyplatform/user-management
        ghcr.io/senergy-platform/user-management
      meta-tags: |
        type=raw,value=dev
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
